<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NonoTech Road Race</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none}
#gameContainer{position:relative;width:100vw;height:100dvh;max-width:520px;margin:auto;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
#splash,#gameOver{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at center,#202020 0%,#080808 65%);z-index:20;transition:opacity .4s}
#gameOver{display:none;opacity:0;z-index:25}
#splash h1{font-family:'Press Start 2P',monospace;color:#ff8c1a;font-size:clamp(26px,9vw,52px);text-align:center;text-shadow:4px 4px #713900}
#splash h2{margin-top:18px;color:#fff;font-family:'Press Start 2P',monospace;font-size:clamp(9px,3vw,15px)}
#splash p{margin-top:28px;color:#7CFC00;font-family:'Press Start 2P',monospace;font-size:clamp(9px,3vw,15px);animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
#gameOver h1{font-family:'Press Start 2P',monospace;color:#ff3030;font-size:clamp(20px,7vw,40px);text-shadow:4px 4px #620000}
#gameOver p{margin-top:20px;font-family:'Press Start 2P',monospace;color:#fff;font-size:clamp(10px,3vw,15px)}
#finalKm{color:#7CFC00}#bestScore{margin-top:14px;color:#ffd700}
#startBtn{margin-top:30px;padding:14px 28px;background:#ff8c1a;color:#111;border:3px solid #c65a00;border-radius:6px;font-family:'Press Start 2P',monospace;font-size:clamp(11px,3.5vw,17px)}
#hud{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;padding:12px;pointer-events:none;font-family:'Press Start 2P',monospace}
.hud-box{min-width:72px;padding:6px 8px;background:rgba(0,0,0,.58);border:2px solid #ffb347;border-radius:4px}
.hud-label{color:#7CFC00;font-size:clamp(7px,2vw,10px)}
.hud-value{color:#fff;margin-top:4px;font-size:clamp(12px,4vw,21px)}
.center{text-align:center}.right{text-align:right}
#controls{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-between;padding:20px;pointer-events:none}
.ctrl-btn{width:clamp(58px,17vw,82px);height:clamp(58px,17vw,82px);display:flex;justify-content:center;align-items:center;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;font-size:clamp(20px,6vw,30px);pointer-events:auto;transition:.1s}
.ctrl-btn.active{background:rgba(255,140,26,.5);border-color:#ff8c1a;transform:scale(.94)}
#crashFlash{position:absolute;inset:0;z-index:8;background:red;opacity:0;pointer-events:none}
#crashText{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);z-index:9;color:#fff;font-family:'Press Start 2P',monospace;font-size:clamp(14px,5vw,27px);text-shadow:3px 3px #a00000;opacity:0;pointer-events:none}
#pauseBtn{position:absolute;top:74px;right:12px;z-index:10;width:42px;height:42px;border-radius:8px;border:2px solid #fff;background:rgba(0,0,0,.55);color:#fff;font-size:18px}
#pauseScreen{position:absolute;inset:0;z-index:19;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7)}
#pauseScreen div{font-family:'Press Start 2P',monospace;color:#fff;font-size:20px}
</style>
</head>
<body>
<div id="gameContainer">
<canvas id="game"></canvas>
<div id="crashFlash"></div><div id="crashText">CRASH!</div>

<div id="hud">
  <div class="hud-box"><div class="hud-label">KM</div><div class="hud-value" id="kmVal">0000.0</div></div>
  <div class="hud-box center"><div class="hud-label">HITS</div><div class="hud-value" id="hitsVal">0/5</div></div>
  <div class="hud-box right"><div class="hud-label">SPEED</div><div class="hud-value" id="speedVal">040</div></div>
</div>

<button id="pauseBtn">Ⅱ</button>
<div id="controls"><div class="ctrl-btn" id="leftBtn">◀</div><div class="ctrl-btn" id="rightBtn">▶</div></div>
<div id="pauseScreen"><div>PAUSED</div></div>

<div id="splash"><h1>NonoTech</h1><h2>ROAD RACE</h2><p>TAP TO START</p></div>

<div id="gameOver">
  <h1>GAME OVER</h1>
  <p>KM: <span id="finalKm">0.0</span></p>
  <p id="bestScore">BEST: 0.0 KM</p>
  <button id="startBtn">START</button>
</div>
</div>

<script>
(function(){
"use strict";

const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const container=document.getElementById("gameContainer");
const splash=document.getElementById("splash"),gameOver=document.getElementById("gameOver"),startBtn=document.getElementById("startBtn");
const kmVal=document.getElementById("kmVal"),speedVal=document.getElementById("speedVal"),hitsVal=document.getElementById("hitsVal");
const finalKm=document.getElementById("finalKm"),bestScore=document.getElementById("bestScore");
const leftBtn=document.getElementById("leftBtn"),rightBtn=document.getElementById("rightBtn");
const pauseBtn=document.getElementById("pauseBtn"),pauseScreen=document.getElementById("pauseScreen");
const crashFlash=document.getElementById("crashFlash"),crashText=document.getElementById("crashText");

const MAX_SPEED=260,START_SPEED=40,ACCEL=4.2,STEER_SPEED=430,KM_SCALE=8,MAX_CRASHES=5,MAX_NPC_ON_SCREEN=5;
let dpr=Math.max(1,Math.min(4,window.devicePixelRatio||1)),W=0,H=0,roadLeft=0,roadRight=0,roadWidth=0;

let player={x:0,y:0,w:0,h:0};
let obstacles=[],speed=START_SPEED,km=0,spawnTimer=1,scrollOffset=0,invulnerable=0,crashCount=0;
let running=false,paused=false,steerDir=0,lastTime=0,lastType=-1;

function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function rand(min,max){return min+Math.random()*(max-min)}
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function resize(){
  const rect=container.getBoundingClientRect();W=rect.width;H=rect.height;
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  roadLeft=W*.20;roadRight=W*.80;roadWidth=roadRight-roadLeft;
  player.w=roadWidth*.19;player.h=player.w*1.55;player.y=H*.76;
  player.x=clamp(player.x,roadLeft+4,roadRight-player.w-4);
}
window.addEventListener("resize",resize);

function drawSedan(x,y,w,h,body,accent){
  ctx.save();ctx.shadowColor="rgba(0,0,0,.45)";ctx.shadowBlur=7;ctx.shadowOffsetY=3;
  ctx.fillStyle=body;rr(x,y,w,h,w*.16);ctx.fill();ctx.restore();
  ctx.fillStyle="rgba(0,0,0,.15)";rr(x,y,w*.15,h,w*.07);ctx.fill();rr(x+w*.85,y,w*.15,h,w*.07);ctx.fill();
  ctx.fillStyle="rgba(170,220,255,.9)";rr(x+w*.16,y+h*.10,w*.68,h*.20,w*.06);ctx.fill();
  ctx.fillStyle=accent;rr(x+w*.10,y+h*.36,w*.80,h*.24,w*.05);ctx.fill();
  ctx.fillStyle="rgba(170,220,255,.7)";rr(x+w*.18,y+h*.64,w*.64,h*.14,w*.05);ctx.fill();
  ctx.fillStyle="#111";
  rr(x-w*.09,y+h*.10,w*.15,h*.22,w*.04);ctx.fill();rr(x+w*.94,y+h*.10,w*.15,h*.22,w*.04);ctx.fill();
  rr(x-w*.09,y+h*.66,w*.15,h*.22,w*.04);ctx.fill();rr(x+w*.94,y+h*.66,w*.15,h*.22,w*.04);ctx.fill();
  ctx.fillStyle="#fff59d";rr(x+w*.08,y+h*.02,w*.18,h*.05,h*.02);ctx.fill();rr(x+w*.74,y+h*.02,w*.18,h*.05,h*.02);ctx.fill();
  ctx.fillStyle="#e53935";rr(x+w*.08,y+h*.93,w*.18,h*.05,h*.02);ctx.fill();rr(x+w*.74,y+h*.93,w*.18,h*.05,h*.02);ctx.fill();
}
function drawTruck(x,y,w,h,body,accent,cab){
  ctx.fillStyle=body;rr(x,y+h*.24,w,h*.72,w*.10);ctx.fill();
  ctx.fillStyle=cab||accent;rr(x+w*.08,y,w*.84,h*.22,w*.10);ctx.fill();
  ctx.fillStyle="rgba(170,220,255,.9)";rr(x+w*.16,y+h*.03,w*.68,h*.13,w*.04);ctx.fill();
  ctx.fillStyle=accent;ctx.fillRect(x,y+h*.50,w,h*.08);
  ctx.fillStyle="#111";
  rr(x-w*.07,y+h*.14,w*.13,h*.16,w*.04);ctx.fill();rr(x+w*.94,y+h*.14,w*.13,h*.16,w*.04);ctx.fill();
  rr(x-w*.07,y+h*.72,w*.13,h*.18,w*.04);ctx.fill();rr(x+w*.94,y+h*.72,w*.13,h*.18,w*.04);ctx.fill();
  ctx.fillStyle="#fff59d";rr(x+w*.08,y+h*.01,w*.16,h*.04,h*.015);ctx.fill();rr(x+w*.76,y+h*.01,w*.16,h*.04,h*.015);ctx.fill();
  ctx.fillStyle="#e53935";rr(x+w*.06,y+h*.94,w*.16,h*.05,h*.02);ctx.fill();rr(x+w*.78,y+h*.94,w*.16,h*.05,h*.02);ctx.fill();
}
function drawAuto(x,y,w,h,body,accent){
  ctx.fillStyle="#171717";rr(x+w*.14,y+h*.55,w*.72,h*.40,w*.08);ctx.fill();
  ctx.fillStyle=body;ctx.beginPath();ctx.moveTo(x+w*.06,y+h*.55);ctx.lineTo(x+w*.06,y+h*.24);
  ctx.quadraticCurveTo(x+w*.06,y,x+w*.5,y);ctx.quadraticCurveTo(x+w*.94,y,x+w*.94,y+h*.24);
  ctx.lineTo(x+w*.94,y+h*.55);ctx.closePath();ctx.fill();
  ctx.fillStyle="rgba(15,15,15,.65)";rr(x+w*.14,y+h*.20,w*.72,h*.28,w*.06);ctx.fill();
  ctx.fillStyle=accent;ctx.fillRect(x+w*.06,y+h*.50,w*.88,h*.07);
  ctx.fillStyle="#111";rr(x-w*.05,y+h*.62,w*.13,h*.22,w*.04);ctx.fill();rr(x+w*.92,y+h*.62,w*.13,h*.22,w*.04);ctx.fill();
  ctx.fillStyle="#e53935";rr(x+w*.38,y+h*.92,w*.24,h*.05,h*.02);ctx.fill();
}
function drawSupra(x,y,w,h){
  /* Detailed yellow top-down player car */
  ctx.save();

  ctx.shadowColor="rgba(0,0,0,.48)";
  ctx.shadowBlur=10;
  ctx.shadowOffsetY=5;

  /* main body */
  const g=ctx.createLinearGradient(x, y, x+w, y);
  g.addColorStop(0,"#d99100");
  g.addColorStop(.18,"#ffc928");
  g.addColorStop(.5,"#ffe06a");
  g.addColorStop(.82,"#ffc928");
  g.addColorStop(1,"#d99100");
  ctx.fillStyle=g;
  rr(x,y,w,h,w*.22);
  ctx.fill();

  ctx.restore();

  /* black wheels */
  ctx.fillStyle="#151515";
  rr(x-w*.10,y+h*.14,w*.17,h*.22,w*.05);ctx.fill();
  rr(x+w*.93,y+h*.14,w*.17,h*.22,w*.05);ctx.fill();
  rr(x-w*.10,y+h*.64,w*.17,h*.23,w*.05);ctx.fill();
  rr(x+w*.93,y+h*.64,w*.17,h*.23,w*.05);ctx.fill();

  /* wheel hubs */
  ctx.fillStyle="#777";
  rr(x-w*.055,y+h*.19,w*.08,h*.12,w*.025);ctx.fill();
  rr(x+w*.975,y+h*.19,w*.08,h*.12,w*.025);ctx.fill();
  rr(x-w*.055,y+h*.69,w*.08,h*.12,w*.025);ctx.fill();
  rr(x+w*.975,y+h*.69,w*.08,h*.12,w*.025);ctx.fill();

  /* roof/cabin */
  const roof=ctx.createLinearGradient(0,y+h*.18,0,y+h*.72);
  roof.addColorStop(0,"#202b31");
  roof.addColorStop(.48,"#40535a");
  roof.addColorStop(1,"#182126");
  ctx.fillStyle=roof;
  rr(x+w*.18,y+h*.17,w*.64,h*.49,w*.12);
  ctx.fill();

  /* windshield */
  ctx.fillStyle="#b9dbe0";
  rr(x+w*.25,y+h*.20,w*.50,h*.15,w*.045);ctx.fill();

  /* windshield reflection */
  ctx.fillStyle="rgba(255,255,255,.42)";
  ctx.fillRect(x+w*.29,y+h*.225,w*.22,h*.035);

  /* rear window */
  ctx.fillStyle="#789198";
  rr(x+w*.27,y+h*.52,w*.46,h*.10,w*.035);ctx.fill();

  /* center yellow body stripe */
  ctx.fillStyle="#f5b400";
  rr(x+w*.43,y+h*.12,w*.14,h*.62,w*.035);ctx.fill();

  /* front bumper */
  ctx.fillStyle="#8e6100";
  rr(x+w*.15,y+h*.025,w*.70,h*.075,w*.025);ctx.fill();

  /* headlights */
  ctx.fillStyle="#fff8b0";
  rr(x+w*.11,y+h*.035,w*.22,h*.055,w*.018);ctx.fill();
  rr(x+w*.67,y+h*.035,w*.22,h*.055,w*.018);ctx.fill();

  /* tail lights */
  ctx.fillStyle="#d71919";
  rr(x+w*.11,y+h*.91,w*.22,h*.055,w*.018);ctx.fill();
  rr(x+w*.67,y+h*.91,w*.22,h*.055,w*.018);ctx.fill();

  /* spoiler */
  ctx.fillStyle="#252525";
  rr(x+w*.08,y+h*.78,w*.84,h*.055,w*.018);ctx.fill();

  /* small side mirrors */
  ctx.fillStyle="#202020";
  rr(x+w*.06,y+h*.34,w*.10,h*.07,w*.02);ctx.fill();
  rr(x+w*.84,y+h*.34,w*.10,h*.07,w*.02);ctx.fill();

  /* highlight */
  ctx.strokeStyle="rgba(255,255,255,.45)";
  ctx.lineWidth=Math.max(1,w*.025);
  rr(x+w*.055,y+h*.035,w*.89,h*.91,w*.19);
  ctx.stroke();
}

function drawVehicle(o){
  if(o.type==="truck")drawTruck(o.x,o.y,o.w,o.h,o.body,o.accent,o.cab);
  else if(o.type==="auto")drawAuto(o.x,o.y,o.w,o.h,o.body,o.accent);
  else drawSedan(o.x,o.y,o.w,o.h,o.body,o.accent);
}

const NPC_TYPES=[
 {type:"sedan",body:"#1c5fb0",accent:"#0d2f57",wRatio:.17,hMul:1.55},
 {type:"sedan",body:"#c9c9c9",accent:"#3a3a3a",wRatio:.17,hMul:1.55},
 {type:"sedan",body:"#f2f2f2",accent:"#b71c1c",wRatio:.17,hMul:1.55},
 {type:"sedan",body:"#e53935",accent:"#8e0000",wRatio:.17,hMul:1.55},
 {type:"truck",body:"#e6e6e6",accent:"#1c5fb0",cab:"#1c5fb0",wRatio:.24,hMul:1.9},
 {type:"truck",body:"#263238",accent:"#ff8c1a",cab:"#37474f",wRatio:.24,hMul:1.9},
 {type:"auto",body:"#ffd400",accent:"#111",wRatio:.13,hMul:1.35}
];

function spawnObstacle(){
  let index;
  do{index=Math.floor(Math.random()*NPC_TYPES.length)}
  while(index===lastType&&NPC_TYPES.length>1);
  lastType=index;
  const c=NPC_TYPES[index],w=roadWidth*c.wRatio,h=w*c.hMul;
  const laneX=clamp(rand(roadLeft+8,roadRight-w-8),roadLeft+8,roadRight-w-8);
  obstacles.push({x:laneX,laneX:laneX,y:-h-30,w,h,type:c.type,body:c.body,accent:c.accent,cab:c.cab,speed:rand(120,205)});
  const difficulty=1-(speed/MAX_SPEED)*.30;
  spawnTimer=rand(.85,1.65)*difficulty;
}
function overlap(a,b){
  const p=5;
  return a.x+p<b.x+b.w-p&&a.x+a.w-p>b.x+p&&a.y+p<b.y+b.h-p&&a.y+a.h-p>b.y+p;
}
function triggerCrash(){
  crashCount++;hitsVal.textContent=crashCount+"/"+MAX_CRASHES;
  crashFlash.style.transition="none";crashFlash.style.opacity=".55";
  crashText.style.transition="none";crashText.style.opacity="1";
  setTimeout(()=>{crashFlash.style.transition="opacity .45s ease";crashFlash.style.opacity="0";
    crashText.style.transition="opacity .7s ease";crashText.style.opacity="0"},60);
  if(crashCount>=MAX_CRASHES){gameOverScreen();return}
  invulnerable=1.2;speed=Math.max(START_SPEED,speed*.50);
}
function getBest(){
  const v=parseFloat(localStorage.getItem("nonotech_best_km")||"0");
  return isNaN(v)?0:v;
}
function saveBest(){
  const old=getBest();
  if(km>old){localStorage.setItem("nonotech_best_km",km.toFixed(1));return km}
  return old;
}
function gameOverScreen(){
  running=false;paused=false;pauseScreen.style.display="none";
  const best=saveBest();finalKm.textContent=km.toFixed(1);bestScore.textContent="BEST: "+best.toFixed(1)+" KM";
  gameOver.style.display="flex";requestAnimationFrame(()=>gameOver.style.opacity="1");
}
function resetGame(){
  speed=START_SPEED;km=0;crashCount=0;obstacles=[];spawnTimer=.8;scrollOffset=0;invulnerable=0;steerDir=0;paused=false;
  pauseScreen.style.display="none";pauseBtn.textContent="Ⅱ";
  player.x=roadLeft+roadWidth/2-player.w/2;hitsVal.textContent="0/5";kmVal.textContent="0000.0";speedVal.textContent="040";
  gameOver.style.opacity="0";gameOver.style.display="none";running=true;lastTime=performance.now();requestAnimationFrame(loop);
}
function update(dt){
  speed=Math.min(MAX_SPEED,speed+ACCEL*dt);
  km+=(speed*dt*KM_SCALE)/3600;
  scrollOffset+=(55+speed*1.55)*dt;
  if(steerDir!==0)player.x+=steerDir*STEER_SPEED*dt;
  player.x=clamp(player.x,roadLeft+3,roadRight-player.w-3);

  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];
    o.y+=o.speed*dt;
    o.x=o.laneX; /* NPC remains perfectly straight */
    if(o.y>H+o.h+40)obstacles.splice(i,1);
  }
  spawnTimer-=dt;
  if(spawnTimer<=0){
    if(obstacles.length<MAX_NPC_ON_SCREEN)spawnObstacle();else spawnTimer=.20;
  }
  if(invulnerable>0)invulnerable-=dt;
  else{
    for(let i=0;i<obstacles.length;i++){
      if(overlap(player,obstacles[i])){obstacles.splice(i,1);triggerCrash();break}
    }
  }
  kmVal.textContent=km.toFixed(1).padStart(6,"0");
  speedVal.textContent=String(Math.round(speed)).padStart(3,"0");
}
function drawTree(x,y,s){
  /* Simple crisp top-down tree */
  ctx.save();
  ctx.globalAlpha=.95;

  ctx.fillStyle="rgba(0,0,0,.22)";
  ctx.beginPath();
  ctx.ellipse(x,y+s*.28,s*.72,s*.35,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#684b28";
  rr(x-s*.13,y+s*.18,s*.26,s*.58,s*.06);
  ctx.fill();

  ctx.fillStyle="#2d8b2d";
  ctx.beginPath();ctx.arc(x,y,s*.58,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#4cab32";
  ctx.beginPath();ctx.arc(x-s*.18,y-s*.15,s*.38,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#247524";
  ctx.beginPath();ctx.arc(x+s*.22,y+s*.12,s*.32,0,Math.PI*2);ctx.fill();

  ctx.restore();
}

function drawRoad(){
  /* Green roadside */
  const grass=ctx.createLinearGradient(0,0,0,H);
  grass.addColorStop(0,"#69c936");
  grass.addColorStop(.5,"#55b72f");
  grass.addColorStop(1,"#3d9a29");
  ctx.fillStyle=grass;
  ctx.fillRect(0,0,W,H);

  /* Moving subtle grass texture */
  const gp=95;
  let gy=-gp+(scrollOffset%gp);
  while(gy<H){
    ctx.fillStyle="rgba(255,255,255,.035)";
    ctx.fillRect(0,gy,roadLeft,42);
    ctx.fillRect(roadRight,gy, W-roadRight,42);
    gy+=gp;
  }

  /* Moving roadside trees */
  const treeGap=145;
  let ty=-treeGap+(scrollOffset*.72%treeGap);
  let n=0;
  while(ty<H+treeGap){
    const leftX=roadLeft*.48 + Math.sin((ty+80)*.025)*roadLeft*.18;
    const rightX=roadRight+(W-roadRight)*.52 + Math.sin((ty+30)*.021)*((W-roadRight)*.16);
    drawTree(leftX,ty,Math.max(14,W*.045));
    drawTree(rightX,ty+55,Math.max(14,W*.045));
    ty+=treeGap;
    n++;
    if(n>14)break;
  }

  /* Dark asphalt */
  const roadGrad=ctx.createLinearGradient(roadLeft,0,roadRight,0);
  roadGrad.addColorStop(0,"#343b3d");
  roadGrad.addColorStop(.16,"#3e4648");
  roadGrad.addColorStop(.5,"#424a4c");
  roadGrad.addColorStop(.84,"#3e4648");
  roadGrad.addColorStop(1,"#343b3d");
  ctx.fillStyle=roadGrad;
  ctx.fillRect(roadLeft,0,roadWidth,H);

  /* subtle asphalt highlights */
  ctx.fillStyle="rgba(255,255,255,.025)";
  const stripe=120;
  let sy=-stripe+(scrollOffset*.35%stripe);
  while(sy<H){
    ctx.fillRect(roadLeft,sy,roadWidth,2);
    sy+=stripe;
  }

  /* Yellow double edge lines like the reference */
  const lineW=Math.max(3,W*.008);
  const gap=Math.max(4,W*.010);
  ctx.fillStyle="#ffd21a";

  ctx.fillRect(roadLeft+lineW*.35,0,lineW,H);
  ctx.fillRect(roadLeft+lineW*.35+lineW+gap,0,lineW*.82,H);

  ctx.fillRect(roadRight-lineW*.35-lineW*.82,0,lineW*.82,H);
  ctx.fillRect(roadRight-lineW*.35-lineW-gap,0,lineW,H);

  /* Black rumble strips outside yellow lines */
  ctx.fillStyle="#151515";
  ctx.fillRect(roadLeft-lineW*1.8,0,lineW*.7,H);
  ctx.fillRect(roadRight+lineW*1.1,0,lineW*.7,H);

  /* Two white lane separators = 3 lanes */
  const dashH=Math.max(48,H*.055);
  const dashGap=Math.max(46,H*.065);
  const period=dashH+dashGap;
  const dashW=Math.max(4,W*.010);

  ctx.fillStyle="rgba(255,255,255,.96)";

  const lane1=roadLeft+roadWidth/3-dashW/2;
  const lane2=roadLeft+roadWidth*2/3-dashW/2;

  let dy=-period+(scrollOffset%period);
  while(dy<H){
    ctx.fillRect(lane1,dy,dashW,dashH);
    ctx.fillRect(lane2,dy,dashW,dashH);
    dy+=period;
  }
}

function draw(){
  drawRoad();
  for(const o of obstacles)drawVehicle(o);
  if(invulnerable>0&&Math.floor(invulnerable*18)%2===0)return;
  drawSupra(player.x,player.y,player.w,player.h);
}
function loop(t){
  if(!running)return;
  if(paused){lastTime=t;requestAnimationFrame(loop);return}
  const dt=Math.min(.05,(t-lastTime)/1000||0);lastTime=t;update(dt);draw();requestAnimationFrame(loop);
}
function startGame(){
  splash.style.opacity="0";setTimeout(()=>splash.style.display="none",400);resetGame();
}
function togglePause(){
  if(!running)return;
  paused=!paused;
  if(paused){pauseScreen.style.display="flex";pauseBtn.textContent="▶"}
  else{pauseScreen.style.display="none";pauseBtn.textContent="Ⅱ";lastTime=performance.now()}
}
pauseBtn.addEventListener("pointerdown",e=>{e.preventDefault();togglePause()});

function buttonDown(dir,btn){if(!running||paused)return;steerDir=dir;btn.classList.add("active")}
function buttonUp(btn){
  if(btn===leftBtn&&steerDir===-1)steerDir=0;
  if(btn===rightBtn&&steerDir===1)steerDir=0;
  btn.classList.remove("active");
}
for(const [btn,dir] of [[leftBtn,-1],[rightBtn,1]]){
  btn.addEventListener("pointerdown",e=>{e.preventDefault();buttonDown(dir,btn)});
  btn.addEventListener("pointerup",e=>{e.preventDefault();buttonUp(btn)});
  btn.addEventListener("pointercancel",()=>buttonUp(btn));
  btn.addEventListener("pointerleave",()=>buttonUp(btn));
}
window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(e.key==="ArrowLeft"||k==="a"){e.preventDefault();steerDir=-1;leftBtn.classList.add("active")}
  if(e.key==="ArrowRight"||k==="d"){e.preventDefault();steerDir=1;rightBtn.classList.add("active")}
  if(e.key===" "||k==="p"){e.preventDefault();togglePause()}
});
window.addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();
  if(e.key==="ArrowLeft"||k==="a"){if(steerDir===-1)steerDir=0;leftBtn.classList.remove("active")}
  if(e.key==="ArrowRight"||k==="d"){if(steerDir===1)steerDir=0;rightBtn.classList.remove("active")}
});
splash.addEventListener("pointerdown",e=>{if(e.target===splash)startGame()});
startBtn.addEventListener("pointerdown",e=>{e.preventDefault();startGame()});

resize();
bestScore.textContent="BEST: "+getBest().toFixed(1)+" KM";
draw();
})();
</script>
